services:
  mysql:
    image: mysql:8.4
    container_name: mm1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MM1_MYSQL_ROOT_PASSWORD:-ChangeRootPass123!}
      MYSQL_DATABASE: ${MM1_DB_NAME:-mm1_microfinance}
      MYSQL_USER: ${MM1_DB_USER:-mm1_app}
      MYSQL_PASSWORD: ${MM1_DB_PASSWORD:-ChangeAppPass123!}
    ports:
      - "127.0.0.1:${MM1_DB_PORT:-3306}:3306"
    volumes:
      - mm1_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MM1_MYSQL_ROOT_PASSWORD:-ChangeRootPass123!}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: mm1-app
    restart: unless-stopped
    environment:
      MM1_HOST: 0.0.0.0
      MM1_PORT: 8080
      MM1_DB_HOST: mysql
      MM1_DB_PORT: 3306
      MM1_DB_NAME: ${MM1_DB_NAME:-mm1_microfinance}
      MM1_DB_USER: ${MM1_DB_USER:-mm1_app}
      MM1_DB_PASSWORD: ${MM1_DB_PASSWORD:-ChangeAppPass123!}
    ports:
      - "127.0.0.1:${MM1_APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mm1_mysql_data:
